  onHeaderInput(e) { this.setState({ newRecordHeader: e.target.value }); }
  onSortOrderInput(e) { this.setState({ newRecordSortOrder: e.target.value }); }
  onTaggingNoteInput(e) { this.setState({ taggingNote: e.target.value }); }
  onUrlInput(index, e) {
    const recordUrls = this.state.recordUrls.slice();
    recordUrls[index] = e.target.value;
    this.setState({ recordUrls });
  }
  addUrlRow() { this.setState({ recordUrls: [...this.state.recordUrls, ''] }); }
  addRecordAttachment() {
    const n = this.state.recordAttachments.length + 1;
    this.setState({ recordAttachments: [...this.state.recordAttachments, { name: 'Attachment_' + n + '.pdf' }] });
  }
  removeRecordAttachment(index) {
    this.setState({ recordAttachments: this.state.recordAttachments.filter((_, i) => i !== index) });
  }

  openCreateSub() {
    this.setState({
      showCreateSub: true,
      subDropdownOpen: null,
      subName: '',
      subType: 'In Scope',
      subOwner: '',
      subBackup: '',
      subCategoriesFilled: false,
      subMarketsFilled: false,
      subWbSchemesFilled: false,
      subScope: '',
      subExclusions: '',
      subNote: '',
      subNoteApplied: true,
      subInternalNotes: '',
    });
  }
  closeCreateSub() { this.setState({ showCreateSub: false, subDropdownOpen: null }); }
  toggleSubDropdown(name) {
    this.setState({ subDropdownOpen: this.state.subDropdownOpen === name ? null : name });
  }
  onSubNameInput(e) { this.setState({ subName: e.target.value }); }
  selectSubType(type) { this.setState({ subType: type, subDropdownOpen: null }); }
  selectSubOwner(name) { this.setState({ subOwner: name, subDropdownOpen: null }); }
  selectSubBackup(name) { this.setState({ subBackup: name, subDropdownOpen: null }); }
  toggleSubCategories() { this.setState({ subCategoriesFilled: !this.state.subCategoriesFilled }); }
  toggleSubMarkets() { this.setState({ subMarketsFilled: !this.state.subMarketsFilled }); }
  toggleSubWbSchemes() { this.setState({ subWbSchemesFilled: !this.state.subWbSchemesFilled }); }
  onSubScopeInput(e) { this.setState({ subScope: e.target.value }); }
  onSubExclusionsInput(e) { this.setState({ subExclusions: e.target.value }); }
  onSubNoteInput(e) { this.setState({ subNote: e.target.value }); }
  toggleSubNoteApplied() { this.setState({ subNoteApplied: !this.state.subNoteApplied }); }
  onSubInternalNotesInput(e) { this.setState({ subInternalNotes: e.target.value }); }

  isSubValid() {
    const s = this.state;
    return (
      s.subName.trim().length > 0 &&
      !!s.subType &&
      s.subOwner.trim().length > 0 &&
      s.subCategoriesFilled &&
      s.subMarketsFilled &&
      s.subScope.trim().length > 0
    );
  }

  submitCreateSub() {
    if (!this.isSubValid()) return;
    const s = this.state;
    const newSub = {
      name: s.subName.trim(),
      type: s.subType,
      markets: s.subMarketsFilled ? ['Selected Market'] : [],
      categories: s.subCategoriesFilled ? ['Selected Category'] : [],
      scheme: s.subWbSchemesFilled ? 'Selected Scheme' : '',
      owner: s.subOwner,
      backup: s.subBackup || '—',
      updated: 'Just now',
      records: 0,
      scopeText: s.subScope.trim(),
      exclusions: s.subExclusions.trim() ? [s.subExclusions.trim()] : [],
      note: s.subNote.trim(),
    };
    this.setState({
      showCreateSub: false,
      customSubContainers: [...this.state.customSubContainers, newSub],
    });
  }

  toggleSubContainerMenu(id) {
    this.setState({ subContainerMenuOpen: this.state.subContainerMenuOpen === id ? null : id });
  }
  closeSubContainerMenu() { this.setState({ subContainerMenuOpen: null }); }

  toggleRecordMenu(id) {
    this.setState({ recordMenuOpen: this.state.recordMenuOpen === id ? null : id });
  }
  closeRecordMenu() { this.setState({ recordMenuOpen: null }); }

  openSubViewByName(name) {
    const baseNames = ['Medical Devices (MDR)', 'Machinery (MD)', 'Low Voltage Directive (LVD)', 'EMC Directive', 'Radio Equipment (RED)'];
    const customNames = this.state.customSubContainers.map((c) => c.name);
    const allNames = baseNames.concat(customNames);
    const idx = allNames.indexOf(name);
    this.openSubView(idx >= 0 ? idx : 0);
  }
  openSubView(i, focusRecords) {
    this.setState({
      viewMode: 'sub', activeSubIndex: i, subContainerMenuOpen: null,
      activeTab: 'definition', recordsTableSearch: '', recordsTypeFilter: 'all',
      recordsSortKey: 'name', recordsSortDir: 'asc', recordsPage: 1,
    });
    if (focusRecords) {
      setTimeout(() => {
        const el = document.getElementById('section-associated-records');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 60);
    } else {
      window.scrollTo(0, 0);
    }
  }
  closeSubView() {
    this.setState({
      viewMode: 'container', activeSubIndex: null,
      activeTab: 'definition', recordsTableSearch: '', recordsTypeFilter: 'all',
      recordsSortKey: 'name', recordsSortDir: 'asc', recordsPage: 1,
    });
    window.scrollTo(0, 0);
  }

  scrollToSection(id) {
    const el = document.getElementById(id);
    const container = document.getElementById('cv-record-scroll');
    if (el && container) {
      container.scrollTo({ top: el.offsetTop - 8, behavior: 'smooth' });
    }
  }

  isNewRecordValid() {
    const s = this.state;
    const hasChangeDetails = s.noAdditionalDetails || s.changeDetails.trim().length > 0;
    return (
      s.newRecordName.trim().length > 0 &&
      s.newRecordCitation.trim().length > 0 &&
      hasChangeDetails &&
      s.regulatoryCategoriesFilled &&
      s.newRecordSortOrder.toString().trim().length > 0
    );
  }

  submitNewRecord() {
    if (!this.isNewRecordValid()) return;
    this.setState({ showAddRecords: false, ...this.resetNewRecordFields() });
  }

  renderVals() {
    const accent = this.props.accent ?? '#C8102E';
    const surfaceDark = this.props.surfaceDark ?? '#3F3E3C';

    const mkList = (arr) => arr.map((label) => ({ label }));
    const mkFiles = (arr) => arr.map((name) => ({ name }));

    const container = {
      id: '24193',
      name: 'EU CE Marking',
      statusLabel: 'ACTIVE',
      owner: 'Michael Schmidt',
      backup: 'Emma Johnson',
      updated: 'Apr 17, 2026',
      historyCount: 12,
      appliedToRecords: true,
      scheme: mkList(['EU – CE Marking', 'EU MDR', 'EU LVD', 'EU EMC']),
      markets: mkList(['Germany', 'France', 'Italy', 'Spain']),
      categories: mkList(['Medical Devices', 'Industrial Equipment', 'Consumer Electronics']),
      scopeText: 'This container defines products subject to CE Marking requirements under EU regulations, including electrical, mechanical, and medical device products distributed within the European Economic Area (EEA).',
      scopeDirectives: mkList([
        'Medical Devices Regulation (MDR) 2017/745',
        'Machinery Directive 2006/42/EC',
        'Low Voltage Directive (LVD) 2014/35/EU',
        'EMC Directive 2014/30/EU',
      ]),
      scopeFiles: mkFiles(['CE_Marking_Technical_File_Template.docx', 'EU_MDR_Compliance_Checklist.pdf']),
      exclusions: mkList([
        'Products intended solely for military use',
        'In-vitro diagnostic devices (covered under a separate IVDR container)',
        'Custom-made devices manufactured for a single named patient',
      ]),
      exclusionFiles: mkFiles(['CE_Exclusions_Reference.pdf']),
      noteItems: mkList([
        'Apply this container to all EU-bound product records at initial classification.',
        'Reassess annually or upon regulatory update.',
        'Escalate ambiguous classifications to the regulatory affairs team.',
      ]),
      notesFiles: mkFiles(['Internal_Review_Notes_Q2.pdf']),
    };

    container.schemeText = container.scheme.map((c) => c.label).join(', ');
    container.marketsText = container.markets.map((c) => c.label).join(', ');
    container.categoriesText = container.categories.map((c) => c.label).join(', ');

    const rawSubs = [
      {
        name: 'Medical Devices (MDR)', type: 'In Scope',
        markets: ['Germany', 'France', 'Italy', 'Spain'], categories: ['Medical Devices'],
        scheme: 'EU MDR', owner: 'Michael Schmidt', backup: 'Emma Johnson',
        updated: 'Apr 17, 2026', records: 14,
        scopeText: 'Covers medical devices placed on the EU market under Regulation (EU) 2017/745, including Class I through Class III devices requiring CE marking via MDR conformity assessment.',
        exclusions: ['Custom-made devices manufactured for a single named patient', 'In-vitro diagnostic devices (covered under a separate IVDR container)'],
        note: 'Apply MDR conformity assessment procedures for all Class IIa and above devices.',
      },
      {
        name: 'Machinery (MD)', type: 'In Scope',
        markets: ['Germany', 'France'], categories: ['Industrial Equipment'],
        scheme: 'EU – Machinery Directive', owner: 'Michael Schmidt', backup: 'Emma Johnson',
        updated: 'Apr 10, 2026', records: 9,
        scopeText: 'Covers industrial machinery and related equipment subject to Machinery Directive 2006/42/EC, including safety components placed on the market separately.',
        exclusions: ['Machinery intended solely for export outside the EEA'],
        note: 'Escalate any CE-marked machinery missing a Declaration of Conformity.',
      },
      {
        name: 'Low Voltage Directive (LVD)', type: 'In Scope',
        markets: ['Italy', 'Spain'], categories: ['Consumer Electronics'],
        scheme: 'EU LVD', owner: 'Emma Johnson', backup: 'Michael Schmidt',
        updated: 'Apr 5, 2026', records: 11,
        scopeText: 'Covers electrical equipment designed for use within 50-1000V AC / 75-1500V DC, per Low Voltage Directive 2014/35/EU.',
        exclusions: [],
        note: '',
      },
      {
        name: 'EMC Directive', type: 'In Scope',
        markets: ['Germany', 'France', 'Italy', 'Spain'], categories: ['Consumer Electronics', 'Industrial Equipment'],
        scheme: 'EU EMC', owner: 'Michael Schmidt', backup: 'Emma Johnson',
        updated: 'Mar 30, 2026', records: 7,
        scopeText: 'Covers apparatus liable to cause, or be affected by, electromagnetic disturbance, per EMC Directive 2014/30/EU.',
        exclusions: [],
        note: '',
      },
      {
        name: 'Radio Equipment (RED)', type: 'Out of Scope',
        markets: ['Germany'], categories: [],
        scheme: '', owner: 'Emma Johnson', backup: 'Michael Schmidt',
        updated: 'Mar 12, 2026', records: 3,
        scopeText: 'Radio equipment is tracked under a separate RED container and is explicitly out of scope here to avoid duplicate classification.',
        exclusions: ['All radio equipment — see the dedicated Radio Equipment (RED) container'],
        note: '',
      },
      ...this.state.customSubContainers,
    ];

    const typeStyle = (type) => {
      if (type === 'Out of Scope') return { bg: '#FBE7E9', border: '#E7B3BA', color: '#A6172A' };
      return { bg: '#E4F5EA', border: '#B7E3C6', color: '#1E7A44' };
    };

    const allMockRecords = buildMockRecords();

    container.subContainers = rawSubs.map((s, i) => {
      const ts = typeStyle(s.type);
      return {
        name: s.name,
        type: s.type,
        typeBg: ts.bg, typeBorder: ts.border, typeColor: ts.color,
        markets: s.markets,
        categories: s.categories,
        marketsChips: makeChips(s.markets, 1),
        categoriesChips: makeChips(s.categories, 1),
        noCategories: s.categories.length === 0,
        scheme: s.scheme,
        hasScheme: !!s.scheme,
        noScheme: !s.scheme,
        schemeCellText: s.scheme ? s.scheme : '—',
        owner: s.owner,
        backup: s.backup,
        updated: s.updated,
        recordCount: allMockRecords.filter((r) => r.container === s.name).length,
        rowBg: i % 2 === 0 ? '#FFFFFF' : '#FBFBFB',
        menuOpen: this.state.subContainerMenuOpen === i,
        toggleMenu: () => this.toggleSubContainerMenu(i),
        closeMenu: () => this.closeSubContainerMenu(),
        openView: () => this.openSubView(i),
        openRecords: () => this.openSubView(i, true),
        scopeText: s.scopeText || ('Defines the ' + s.name + ' classification within ' + container.name + '.'),
        exclusionsList: mkList(s.exclusions || []),
        noteText: s.note || '',
      };
    });

    const mapRecords = (list) => list.map((r) => {
      const ts = recordTypeStyle(r.type);
      return {
        ...r,
        marketsChips: makeChips(r.markets, 1),
        categoriesChips: makeChips(r.categories, 1),
        regCategoriesChips: makeChips(r.regCategories, 1),
        typeBg: ts.bg, typeBorder: ts.border, typeColor: ts.color,
        menuOpen: this.state.recordMenuOpen === r.id,
        toggleMenu: () => this.toggleRecordMenu(r.id),
        closeMenu: () => this.closeRecordMenu(),
      };
    });

    const applyTableControls = (records) => {
      const searchQ = this.state.recordsTableSearch.trim().toLowerCase();
      const typeFilter = this.state.recordsTypeFilter;
      let list = records.filter((r) => {
        const matchesSearch = !searchQ || r.name.toLowerCase().includes(searchQ) || (r.citation || '').toLowerCase().includes(searchQ);
        const matchesType = typeFilter === 'all' || r.type === typeFilter;
        return matchesSearch && matchesType;
      });
      const sortKey = this.state.recordsSortKey;
      const sortDir = this.state.recordsSortDir;
      list = list.slice().sort((a, b) => {
        const av = (a[sortKey] || '').toString().toLowerCase();
        const bv = (b[sortKey] || '').toString().toLowerCase();
        if (av < bv) return sortDir === 'asc' ? -1 : 1;
        if (av > bv) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });
      const totalFiltered = list.length;
      const totalPages = Math.max(1, Math.ceil(totalFiltered / RECORDS_PAGE_SIZE));
      const safePage = Math.min(Math.max(1, this.state.recordsPage), totalPages);
      const startIdx = (safePage - 1) * RECORDS_PAGE_SIZE;
      return {
        pageRecords: list.slice(startIdx, startIdx + RECORDS_PAGE_SIZE).map((r, i) => ({ ...r, rowBg: i % 2 === 0 ? '#FFFFFF' : '#FBFBFB' })),
        totalFiltered,
        totalPages,
        safePage,
        rangeStart: totalFiltered === 0 ? 0 : startIdx + 1,
        rangeEnd: Math.min(startIdx + RECORDS_PAGE_SIZE, totalFiltered),
      };
    };

    const directRecords = allMockRecords.filter((r) => r.container === container.name);
    container.recordCount = directRecords.length;
    const mainTableResult = applyTableControls(mapRecords(directRecords));
    container.records = mainTableResult.pageRecords;
    container.filteredRecordCount = mainTableResult.totalFiltered;
    container.recordsIsEmpty = mainTableResult.totalFiltered === 0;
    container.recordsPage = mainTableResult.safePage;
    container.recordsTotalPages = mainTableResult.totalPages;
    container.recordsRangeStart = mainTableResult.rangeStart;
    container.recordsRangeEnd = mainTableResult.rangeEnd;

    // When a sub-container has been opened (double-click / kebab "View info"), swap the
    // rendered "container" for a synthesized stand-in built from that sub-container's own
    // data, so the whole page (header, scope/exclusions/note cards, associated records)
    // reads the same way it does for a top-level container — "container view mode" applied
    // one level down. The real container object above is left untouched either way.
    const activeSub = this.state.viewMode === 'sub' && this.state.activeSubIndex != null
      ? container.subContainers[this.state.activeSubIndex]
      : null;

    let displayContainer = container;
    if (activeSub) {
      const subDirectRecords = allMockRecords.filter((r) => r.container === activeSub.name);
      const subTableResult = applyTableControls(mapRecords(subDirectRecords));
      displayContainer = {
        id: container.id + '.' + (this.state.activeSubIndex + 1),
        name: activeSub.name,
        statusLabel: activeSub.type === 'Out of Scope' ? 'OUT OF SCOPE' : 'IN SCOPE',
        owner: activeSub.owner,
        backup: activeSub.backup,
        updated: activeSub.updated,
        appliedToRecords: !!activeSub.noteText,
        schemeText: activeSub.hasScheme ? activeSub.scheme : '—',
        marketsText: activeSub.markets.length ? activeSub.markets.join(', ') : '—',
        categoriesText: activeSub.categories.length ? activeSub.categories.join(', ') : '—',
        scopeText: activeSub.scopeText,
        scopeDirectives: [],
        scopeFiles: [],
        exclusions: activeSub.exclusionsList,
        exclusionFiles: [],
        noteItems: activeSub.noteText ? [{ label: activeSub.noteText }] : [],
        notesFiles: [],
        subContainers: [],
        recordCount: subDirectRecords.length,
        records: subTableResult.pageRecords,
        filteredRecordCount: subTableResult.totalFiltered,
        recordsIsEmpty: subTableResult.totalFiltered === 0,
        recordsPage: subTableResult.safePage,
        recordsTotalPages: subTableResult.totalPages,
        recordsRangeStart: subTableResult.rangeStart,
        recordsRangeEnd: subTableResult.rangeEnd,
      };
    }

    return {
      accent,
      surfaceDark,
      container: displayContainer,
      isSubMode: !!activeSub,
      isContainerMode: !activeSub,
      parentContainerName: container.name,
      containerLabel: activeSub ? 'Sub-Container' : 'Container',
      noteCardLabel: activeSub ? 'Sub-Container Note' : 'Container Note',
      closeSubView: () => this.closeSubView(),

      // Compact metadata row expand/collapse
      metadataExpanded: this.state.metadataExpanded,
      toggleMetadata: () => this.toggleMetadata(),
      metadataToggleLabel: this.state.metadataExpanded ? 'View less' : 'View more',
      metadataChevronRotation: this.state.metadataExpanded ? 'rotate(180deg)' : 'rotate(0deg)',

      // Section tabs
      showSubContainersTab: !activeSub,
      isDefinitionTabActive: this.state.activeTab === 'definition',
      isSubContainersTabActive: !activeSub && this.state.activeTab === 'subcontainers',
      setDefinitionTab: () => this.setActiveTab('definition'),
      setSubContainersTab: () => this.setActiveTab('subcontainers'),
      definitionTabBorder: this.state.activeTab === 'definition' ? accent : 'transparent',
      definitionTabColor: this.state.activeTab === 'definition' ? '#1F1D1B' : '#6B6A67',
      subContainersTabBorder: this.state.activeTab === 'subcontainers' ? accent : 'transparent',
      subContainersTabColor: this.state.activeTab === 'subcontainers' ? '#1F1D1B' : '#6B6A67',

      // Associated Records table tooling
      recordsTableSearch: this.state.recordsTableSearch,
      onRecordsTableSearchInput: (e) => this.onRecordsTableSearchInput(e),
      recordTypeFilters: ['all', 'Standard', 'Regulation', 'Requirement'].map((key) => {
        const active = this.state.recordsTypeFilter === key;
        const ts = key === 'all' ? { bg: '#1F1D1B', border: '#1F1D1B', color: '#FFFFFF' } : recordTypeStyle(key);
        return {
          key,
          label: key === 'all' ? 'All types' : key,
          bg: active ? ts.bg : '#FFFFFF',
          border: active ? ('1px solid ' + ts.border) : '1px solid #D3D1CC',
          color: active ? ts.color : '#6B6A67',
          select: () => this.setRecordsTypeFilter(key),
        };
      }),
      setSortType: () => this.setRecordsSort('type'),
      setSortName: () => this.setRecordsSort('name'),
      typeSortColor: this.state.recordsSortKey === 'type' ? accent : '#9B9992',
      typeSortRotate: this.state.recordsSortKey === 'type' && this.state.recordsSortDir === 'desc' ? 'rotate(180deg)' : 'rotate(0deg)',
      nameSortColor: this.state.recordsSortKey === 'name' ? accent : '#9B9992',
      nameSortRotate: this.state.recordsSortKey === 'name' && this.state.recordsSortDir === 'desc' ? 'rotate(180deg)' : 'rotate(0deg)',
      recordsPrevPage: () => this.recordsPrevPage(),
      recordsNextPage: () => this.recordsNextPage(displayContainer.recordsTotalPages),
      recordsPrevDisabled: displayContainer.recordsPage <= 1,
      recordsNextDisabled: displayContainer.recordsPage >= displayContainer.recordsTotalPages,
      recordsPrevBg: displayContainer.recordsPage <= 1 ? '#F4F3F1' : '#FFFFFF',
      recordsPrevColor: displayContainer.recordsPage <= 1 ? '#B7B5AF' : '#3F3E3C',
      recordsPrevCursor: displayContainer.recordsPage <= 1 ? 'not-allowed' : 'pointer',
      recordsNextBg: displayContainer.recordsPage >= displayContainer.recordsTotalPages ? '#F4F3F1' : '#FFFFFF',
      recordsNextColor: displayContainer.recordsPage >= displayContainer.recordsTotalPages ? '#B7B5AF' : '#3F3E3C',
      recordsNextCursor: displayContainer.recordsPage >= displayContainer.recordsTotalPages ? 'not-allowed' : 'pointer',

      ...this.renderAddRecordsVals(),
    };
  }

  renderAddRecordsVals() {
    const typeStyle = (type) => {
      if (type === 'Regulation') return { bg: '#FBEFE0', border: '#F0D3A8', color: '#92610F' };
      if (type === 'Requirement') return { bg: '#E3F6F7', border: '#BFE8EC', color: '#0E7490' };
      return { bg: '#F1EDFB', border: '#D9CFF3', color: '#5B3FA6' };
    };

    const rawSuggestions = [
      {
        id: 'red', name: 'Radio Equipment Directive (RED)', type: 'Regulation',
        citation: 'Directive 2014/53/EU', alreadyIn: ['EU CE Marking'],
      },
      {
        id: 'iec60950', name: 'IEC 60950-1 IT Equipment Safety', type: 'Standard',
        citation: 'IEC 60950-1:2005+A2:2013', alreadyIn: ['EU CE Marking', 'US FCC'],
      },
      {
        id: 'rohs', name: 'RoHS Compliance Requirements', type: 'Requirement',
        value: 'Restricts use of Pb, Hg, Cd, Cr(VI), PBB, PBDE above threshold', alreadyIn: [],
      },
      {
        id: 'en55032', name: 'EN 55032 EMC Standard', type: 'Standard',
        citation: 'EN 55032:2015', amendment: 'Amendment A11:2020', alreadyIn: ['EU CE Marking'],
      },
    ];

    const query = this.state.recordSearch.trim().toLowerCase();
    const filtered = query
      ? rawSuggestions.filter((s) => s.name.toLowerCase().includes(query) || s.type.toLowerCase().includes(query))
      : rawSuggestions;

    const suggestions = filtered.map((s) => {
      const ts = typeStyle(s.type);
      const selected = this.state.selectedSuggestionId === s.id;
      return {
        id: s.id,
        name: s.name,
        type: s.type,
        typeBg: ts.bg, typeBorder: ts.border, typeColor: ts.color,
        hasCitation: !!s.citation,
        citation: s.citation ?? '',
        hasAmendment: !!s.amendment,
        amendment: s.amendment ?? '',
        hasValue: !!s.value,
        value: s.value ?? '',
        hasAlready: s.alreadyIn.length > 0,
        alreadyIn: (s.alreadyIn ?? []).map((label) => ({ label })),
        borderStyle: selected ? '2px solid #2563EB' : '1px solid #E1DFDB',
        bgStyle: selected ? '#EFF6FF' : '#FFFFFF',
        select: () => this.selectSuggestion(s.id),
      };
    });

    const newRecordType = this.state.newRecordType;
    const typeMeta = {
      standard: { label: 'Standard', fieldLabel: 'Standard Name', placeholder: 'e.g., IEC 60950-1' },
      regulation: { label: 'Regulation', fieldLabel: 'Regulation Name', placeholder: 'e.g., Medical Devices Regulation' },
      requirement: { label: 'Requirement', fieldLabel: 'Requirement Name', placeholder: 'e.g., RoHS Compliance Requirements' },
    };

    const recordTypeOptions = ['standard', 'regulation', 'requirement'].map((key) => {
      const selected = newRecordType === key;
      return {
        key,
        label: typeMeta[key].label,
        bg: selected ? '#F3EEFC' : '#FFFFFF',
        border: selected ? '1.5px solid #B49CE8' : '1px solid #D3D1CC',
        color: selected ? '#6B3FA0' : '#1F1D1B',
        select: () => this.setNewRecordType(key),
      };
    });

    const isNewRecordValid = this.isNewRecordValid();

    const detailsComplete = this.state.newRecordName.trim().length > 0 && this.state.newRecordCitation.trim().length > 0;
    const reasonsComplete = this.state.noAdditionalDetails || this.state.changeDetails.trim().length > 0;
    const taggingComplete = this.state.regulatoryCategoriesFilled && this.state.newRecordSortOrder.toString().trim().length > 0;

    return {
      showAddRecords: this.state.showAddRecords,
      isSearchStep: this.state.addRecordsStep === 'search',
      isCreateStep: this.state.addRecordsStep === 'create',
      addRecordsTitle: this.state.addRecordsStep === 'create' ? 'Create New Record' : 'Add Records',
      recordSearch: this.state.recordSearch,
      onRecordSearchInput: (e) => this.onRecordSearchInput(e),
      openAddRecords: () => this.openAddRecords(),
      closeAddRecords: () => this.closeAddRecords(),
      openCreateRecord: () => this.openCreateRecord(),
      backToSearch: () => this.backToSearch(),
      suggestions,
      recordTypeOptions,
      nameFieldLabel: typeMeta[newRecordType].fieldLabel,
      namePlaceholder: typeMeta[newRecordType].placeholder,
      newRecordName: this.state.newRecordName,
      newRecordCitation: this.state.newRecordCitation,
      newRecordAmendment: this.state.newRecordAmendment,
      newRecordRemovalDate: this.state.newRecordRemovalDate,
      newRecordReason: this.state.newRecordReason,
      onNewRecordNameInput: (e) => this.onNewRecordNameInput(e),
      onNewRecordCitationInput: (e) => this.onNewRecordCitationInput(e),
      onNewRecordAmendmentInput: (e) => this.onNewRecordAmendmentInput(e),
      onNewRecordRemovalDateInput: (e) => this.onNewRecordRemovalDateInput(e),
      onNewRecordReasonInput: (e) => this.onNewRecordReasonInput(e),
      submitNewRecord: () => this.submitNewRecord(),
      createRecordDisabled: !isNewRecordValid,
      createRecordBg: isNewRecordValid ? '#0461A3' : '#E1DFDB',
      createRecordColor: isNewRecordValid ? '#FFFFFF' : '#9C9A95',
      createRecordCursor: isNewRecordValid ? 'pointer' : 'not-allowed',
      modalWidth: '1160px',
      modalHeight: '860px',
      navSections: [
        { id: 'section-record-details', label: 'Record Details' },
        { id: 'section-reasons', label: 'Reasons for Change' },
        { id: 'section-tagging', label: 'Tagging Configuration' },
      ].map((n) => ({
        ...n,
        bg: 'transparent',
        color: '#3F3E3C',
        weight: '600',
        jump: () => this.scrollToSection(n.id),
      })),
      noAdditionalDetails: this.state.noAdditionalDetails,
      changeDetails: this.state.changeDetails,
      changeDetailsBg: this.state.noAdditionalDetails ? '#F4F3F1' : '#FFFFFF',
      changeDetailsCount: this.state.changeDetails.length,
      onChangeDetailsInput: (e) => this.onChangeDetailsInput(e),
      toggleNoAdditionalDetails: () => this.toggleNoAdditionalDetails(),
      regCategoriesLabel: this.state.regulatoryCategoriesFilled ? 'Product Safety, Conformity Assessment' : 'Select categories...',
      regCategoriesColor: this.state.regulatoryCategoriesFilled ? '#1F1D1B' : '#8B8A86',
      toggleRegulatoryCategories: () => this.toggleRegulatoryCategories(),
      newRecordHeader: this.state.newRecordHeader,
      onHeaderInput: (e) => this.onHeaderInput(e),
      newRecordSortOrder: this.state.newRecordSortOrder,
      onSortOrderInput: (e) => this.onSortOrderInput(e),
      taggingNote: this.state.taggingNote,
      onTaggingNoteInput: (e) => this.onTaggingNoteInput(e),
      recordUrls: this.state.recordUrls.map((value, i) => ({
        value,
        onInput: (e) => this.onUrlInput(i, e),
      })),
      addUrlRow: () => this.addUrlRow(),
      recordAttachments: this.state.recordAttachments.map((f, i) => ({
        name: f.name,
        remove: () => this.removeRecordAttachment(i),
      })),
      addRecordAttachment: () => this.addRecordAttachment(),
      detailsSectionOpen: this.state.sectionOpen.details,
      reasonsSectionOpen: this.state.sectionOpen.reasons,
      taggingSectionOpen: this.state.sectionOpen.tagging,
      detailsComplete,
      reasonsComplete,
      taggingComplete,
      detailsChevronRotate: this.state.sectionOpen.details ? 'rotate(180deg)' : 'rotate(0deg)',
      reasonsChevronRotate: this.state.sectionOpen.reasons ? 'rotate(180deg)' : 'rotate(0deg)',
      taggingChevronRotate: this.state.sectionOpen.tagging ? 'rotate(180deg)' : 'rotate(0deg)',
      toggleDetailsSection: () => this.toggleSection('details'),
      toggleReasonsSection: () => this.toggleSection('reasons'),
      toggleTaggingSection: () => this.toggleSection('tagging'),

      showCreateSub: this.state.showCreateSub,
      openCreateSub: () => this.openCreateSub(),
      closeCreateSub: () => this.closeCreateSub(),
      submitCreateSub: () => this.submitCreateSub(),
      subName: this.state.subName,
      onSubNameInput: (e) => this.onSubNameInput(e),
      subType: this.state.subType,
      typeDropdownOpen: this.state.subDropdownOpen === 'type',
      toggleTypeDropdown: () => this.toggleSubDropdown('type'),
      subTypeOptions: ['In Scope', 'Out of Scope'].map((label) => ({
        label,
        bg: this.state.subType === label ? '#F4F3F1' : '#FFFFFF',
        select: () => this.selectSubType(label),
      })),
      subWbSchemesFilled: this.state.subWbSchemesFilled,
      subWbSchemesLabel: this.state.subWbSchemesFilled ? 'EU – CE Marking, EU MDR' : 'Select WB schemes...',
      subWbSchemesColor: this.state.subWbSchemesFilled ? '#1F1D1B' : '#8B8A86',
      toggleSubWbSchemes: () => this.toggleSubWbSchemes(),
      subOwnerLabel: this.state.subOwner || 'Select owner...',
      subOwnerColor: this.state.subOwner ? '#1F1D1B' : '#8B8A86',
      ownerDropdownOpen: this.state.subDropdownOpen === 'owner',
      toggleOwnerDropdown: () => this.toggleSubDropdown('owner'),
      subOwnerOptions: TEAM_MEMBERS.map((name) => ({
        label: name,
        bg: this.state.subOwner === name ? '#F4F3F1' : '#FFFFFF',
        select: () => this.selectSubOwner(name),
      })),
      subBackupLabel: this.state.subBackup || 'None',
      backupDropdownOpen: this.state.subDropdownOpen === 'backup',
      toggleBackupDropdown: () => this.toggleSubDropdown('backup'),
      subBackupOptions: ['None', ...TEAM_MEMBERS].map((name) => ({
        label: name,
        bg: (this.state.subBackup || 'None') === name ? '#F4F3F1' : '#FFFFFF',
        select: () => this.selectSubBackup(name === 'None' ? '' : name),
      })),
      subCategoriesFilled: this.state.subCategoriesFilled,
      subCategoriesLabel: this.state.subCategoriesFilled ? 'Consumer Electronics, Appliances' : 'Select categories...',
      subCategoriesColor: this.state.subCategoriesFilled ? '#1F1D1B' : '#8B8A86',
      toggleSubCategories: () => this.toggleSubCategories(),
      subMarketsFilled: this.state.subMarketsFilled,
      subMarketsLabel: this.state.subMarketsFilled ? 'Japan, South Korea' : 'Select markets...',
      subMarketsColor: this.state.subMarketsFilled ? '#1F1D1B' : '#8B8A86',
      toggleSubMarkets: () => this.toggleSubMarkets(),
      subScope: this.state.subScope,
      onSubScopeInput: (e) => this.onSubScopeInput(e),
      subExclusions: this.state.subExclusions,
      onSubExclusionsInput: (e) => this.onSubExclusionsInput(e),
      subNote: this.state.subNote,
      onSubNoteInput: (e) => this.onSubNoteInput(e),
      subNoteApplied: this.state.subNoteApplied,
      toggleSubNoteApplied: () => this.toggleSubNoteApplied(),
      subNoteToggleBg: this.state.subNoteApplied ? '#1F1D1B' : '#D3D1CC',
      subNoteToggleLeft: this.state.subNoteApplied ? '20px' : '2px',
      subInternalNotes: this.state.subInternalNotes,
      onSubInternalNotesInput: (e) => this.onSubInternalNotesInput(e),
      createSubDisabled: !this.isSubValid(),
      createSubBg: this.isSubValid() ? '#0461A3' : '#E1DFDB',
      createSubColor: this.isSubValid() ? '#FFFFFF' : '#9C9A95',
      createSubCursor: this.isSubValid() ? 'pointer' : 'not-allowed',
    };
  }
}
</script>

<script>

function dcTpl(id) { return document.getElementById(id).textContent; }

window.dcShowScreen = function (name) {
  document.querySelectorAll('.dc-screen').forEach(function (el) { el.classList.remove('active'); });
  var el = document.getElementById('screen-' + name);
  if (el) el.classList.add('active');
  window.scrollTo(0, 0);
};

var dcMainComponent = new MainComponent({});
dcMainComponent.mount(document.getElementById('screen-main'), dcTpl('tpl-main'));

var dcCreateComponent = new CreateContainerComponent({});
dcCreateComponent.mount(document.getElementById('screen-create'), dcTpl('tpl-create'));

var dcViewComponent = new ViewComponent({});
dcViewComponent.mount(document.getElementById('screen-view'), dcTpl('tpl-view'));

window.__dcOpenSub = function (name) {
  if (window.dcViewComponent && typeof dcViewComponent.openSubViewByName === 'function') {
    dcViewComponent.openSubViewByName(name);
  }
  window.dcShowScreen('view');
};

document.querySelectorAll('[data-dc-nav]').forEach(function (el) {
  el.addEventListener('click', function (e) {
    e.preventDefault();
    window.dcShowScreen(el.getAttribute('data-dc-nav'));
  });
});

window.dcShowScreen('main');

</script>

</body>
</html>
